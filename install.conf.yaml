- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

# Create XDG directories on Linux/macOS
- shell:
  - description: Create XDG directories
    command: mkdir -p ~/.config ~/.local/bin ~/.local/share ~/.local/state ~/.cache
    stdout: true
    stderr: true
    quiet: true

# Symlink configurations
- link:
    # Nushell config (cross-platform)
    ~/.config/nushell:
      path: windows/nushell
      create: true

    # Git config (cross-platform)
    ~/.gitconfig:
      path: shared/git/gitconfig
    ~/.gitignore:
      path: shared/git/gitignore_global

    # Starship (cross-platform prompt)
    ~/.config/starship.toml:
      path: shared/starship/starship.toml
      if: '[ -d ~/.config ] || [ "$(uname)" = "Windows_NT" ]'

    # Neovim (cross-platform)
    ~/.config/nvim:
      path: shared/nvim
      create: true

    # WezTerm (Windows only — Linux uses Ghostty, macOS uses Ghostty or native)
    ~/.wezterm.lua:
      path: windows/wezterm/wezterm.lua
      if: '[ "$(uname)" = "Windows_NT" ]'

    # VS Code (cross-platform, each OS has its own user dir)
    ~/.config/Code/User/settings.json:
      path: shared/vscode/settings.json
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.config/Code/User/keybindings.json:
      path: shared/vscode/keybindings.json
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/Library/Application Support/Code/User/settings.json:
      path: shared/vscode/settings.json
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/Library/Application Support/Code/User/keybindings.json:
      path: shared/vscode/keybindings.json
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/AppData/Roaming/Code/User/settings.json:
      path: shared/vscode/settings.json
      if: '[ "$(uname)" = "Windows_NT" ]'
      create: true
    ~/AppData/Roaming/Code/User/keybindings.json:
      path: shared/vscode/keybindings.json
      if: '[ "$(uname)" = "Windows_NT" ]'
      create: true

    # Node configs (cross-platform)
    ~/.npmrc:
      path: shared/node/.npmrc
      if: '[ -f shared/node/.npmrc ]'
    ~/.eslintrc.json:
      path: shared/node/eslintrc.json
      if: '[ -f shared/node/eslintrc.json ]'
    ~/.prettierrc.json:
      path: shared/node/.prettierrc
      if: '[ -f shared/node/.prettierrc ]'

# Ghostty (Linux)
- link:
    ~/.config/ghostty/config:
      path: linux/ghostty/config
      if: '[ "$(uname)" = "Linux" ]'
      create: true

# Tmux (Linux)
- link:
    ~/.config/tmux/tmux.conf:
      path: linux/tmux/tmux.conf
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.local/bin/tmux-dev:
      path: linux/bin/tmux-dev
      if: '[ "$(uname)" = "Linux" ]'
      create: true

# Zsh (Linux)
- link:
    ~/.zshrc:
      path: shared/zsh/zshrc
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.zshrc.os:
      path: linux/zsh/os.zsh
      if: '[ "$(uname)" = "Linux" ]'
      create: true

# Zsh (macOS)
- link:
    ~/.zshrc:
      path: shared/zsh/zshrc
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/.zshrc.os:
      path: macos/zsh/os.zsh
      if: '[ "$(uname)" = "Darwin" ]'
      create: true

# Ghostty (macOS)
- link:
    ~/.config/ghostty/config:
      path: macos/ghostty/config
      if: '[ "$(uname)" = "Darwin" ]'
      create: true

# Tmux (macOS)
- link:
    ~/.config/tmux/tmux.conf:
      path: macos/tmux/tmux.conf
      if: '[ "$(uname)" = "Darwin" ]'
      create: true

# Create local git config if it doesn't exist
- shell:
  - description: Create local gitconfig
    command: test -f ~/.gitconfig-local || cp shared/git/gitconfig-local.example ~/.gitconfig-local
    stdout: true
    stderr: true
