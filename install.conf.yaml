- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

# Create XDG directories on Linux/macOS
- shell:
  - description: Create XDG directories
    command: mkdir -p ~/.config ~/.local/bin ~/.local/share ~/.local/state ~/.cache
    stdout: true
    stderr: true
    quiet: true

# Windows-only links use `if: 'cmd /c exit 0'`: dotbot runs conditions with cmd.exe
# on Windows (so `uname` checks never pass there), and `cmd` doesn't exist on
# macOS/Linux, so the check is only true on Windows.

# Symlink configurations
- link:
    # dotfiles CLI (cross-platform; Windows runs it through dotfiles.cmd)
    ~/.local/bin/dotfiles:
      path: shared/bin/dotfiles
      create: true
    ~/.local/bin/dotfiles.cmd:
      path: windows/bin/dotfiles.cmd
      if: 'cmd /c exit 0'
      create: true

    # PowerShell 7 profile (Windows)
    ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1:
      path: windows/powershell/profile.ps1
      if: 'cmd /c exit 0'
      create: true

    # Git config (cross-platform)
    ~/.gitconfig:
      path: shared/git/gitconfig
    ~/.gitignore:
      path: shared/git/gitignore_global

    # Starship (cross-platform prompt)
    ~/.config/starship.toml:
      path: shared/starship/starship.toml
      create: true

    # Neovim (cross-platform)
    ~/.config/nvim:
      path: shared/nvim
      create: true

    # WezTerm (Windows only; Linux and macOS use Ghostty). Linked as a directory
    # so wezterm.lua can require its modules from the same folder.
    ~/.config/wezterm:
      path: windows/wezterm
      if: 'cmd /c exit 0'
      create: true

    # VS Code (cross-platform, each OS has its own user dir)
    ~/.config/Code/User/settings.json:
      path: shared/vscode/settings.json
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.config/Code/User/keybindings.json:
      path: shared/vscode/keybindings.json
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/Library/Application Support/Code/User/settings.json:
      path: shared/vscode/settings.json
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/Library/Application Support/Code/User/keybindings.json:
      path: shared/vscode/keybindings.json
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/AppData/Roaming/Code/User/settings.json:
      path: shared/vscode/settings.json
      if: 'cmd /c exit 0'
      create: true
    ~/AppData/Roaming/Code/User/keybindings.json:
      path: shared/vscode/keybindings.json
      if: 'cmd /c exit 0'
      create: true

    # lazygit (cross-platform, each OS has its own config dir)
    ~/.config/lazygit/config.yml:
      path: shared/lazygit/config.yml
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/Library/Application Support/lazygit/config.yml:
      path: shared/lazygit/config.yml
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/AppData/Local/lazygit/config.yml:
      path: shared/lazygit/config.yml
      if: 'cmd /c exit 0'
      create: true

    # Node configs (cross-platform)
    ~/.npmrc:
      path: shared/node/.npmrc
      if: '[ -f shared/node/.npmrc ]'
    ~/.eslintrc.json:
      path: shared/node/eslintrc.json
      if: '[ -f shared/node/eslintrc.json ]'
    ~/.prettierrc.json:
      path: shared/node/.prettierrc
      if: '[ -f shared/node/.prettierrc ]'

# Ghostty (Linux)
- link:
    ~/.config/ghostty/config:
      path: linux/ghostty/config
      if: '[ "$(uname)" = "Linux" ]'
      create: true

# Tmux (Linux)
- link:
    ~/.config/tmux/tmux.conf:
      path: linux/tmux/tmux.conf
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.local/bin/tmux-dev:
      path: linux/bin/tmux-dev
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.config/tmux/scripts:
      path: shared/tmux
      if: '[ "$(uname)" = "Linux" ]'
      create: true

# Zsh (Linux)
- link:
    ~/.zshrc:
      path: shared/zsh/zshrc
      if: '[ "$(uname)" = "Linux" ]'
      create: true
    ~/.zshrc.os:
      path: linux/zsh/os.zsh
      if: '[ "$(uname)" = "Linux" ]'
      create: true

# Zsh (macOS)
- link:
    ~/.zshrc:
      path: shared/zsh/zshrc
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/.zshrc.os:
      path: macos/zsh/os.zsh
      if: '[ "$(uname)" = "Darwin" ]'
      create: true

# Ghostty (macOS)
- link:
    ~/.config/ghostty/config:
      path: macos/ghostty/config
      if: '[ "$(uname)" = "Darwin" ]'
      create: true

# Tmux (macOS)
- link:
    ~/.config/tmux/tmux.conf:
      path: macos/tmux/tmux.conf
      if: '[ "$(uname)" = "Darwin" ]'
      create: true
    ~/.config/tmux/scripts:
      path: shared/tmux
      if: '[ "$(uname)" = "Darwin" ]'
      create: true

# Create local git config if it doesn't exist
- shell:
  - description: Create local gitconfig
    command: test -f ~/.gitconfig-local || cp shared/git/gitconfig-local.example ~/.gitconfig-local
    stdout: true
    stderr: true
