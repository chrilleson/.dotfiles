# Only overrides live here; btop falls back to defaults for every other key.
# Saving on exit is off so btop doesn't rewrite this symlinked file.
save_config_on_exit = false

color_theme = "gruvbox_dark"
theme_background = false
vim_keys = true

update_ms = 1000
temp_scale = "celsius"
clock_format = "%H:%M"

# Keep it minimal: cpu, mem and processes only (toggle boxes live with 1-4).
shown_boxes = "cpu mem proc"

# cpu: one graph, no per-core temps, frequency, wattage or battery.
cpu_single_graph = true
show_coretemp = false
show_cpu_freq = false
show_cpu_watts = false
show_battery = false

# mem: plain meters, no swap or disks.
mem_graphs = false
show_swap = false
show_disks = false

# proc: no per-process graphs, no coloring, memory as % instead of bytes.
proc_sorting = "cpu lazy"
proc_filter_kernel = true
proc_cpu_graphs = false
proc_gradient = false
proc_colors = false
proc_mem_bytes = false
