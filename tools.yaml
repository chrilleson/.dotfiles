# Tools the `dotfiles` command installs and resets.
#
# This is the only package list: the install scripts run `dotfiles install --all`.
#
# Each tool lists:
#   links:                 repo paths whose links (from install.conf.yaml) belong to this tool
#   macos/linux/windows:   packages (brew / paru / scoop; scoop takes bucket/app)
#   install:               per-OS shell commands run after installing packages and linking
#   check:                 per-OS shell command that succeeds when the install commands are
#                          already done, so install skips them (and the picker hides the tool)
#   reset:                 per-OS shell commands run before uninstalling
#   upgrade:               per-OS shell commands run by `dotfiles upgrade` (for tools without a package)
#
# Install commands run on every install, so keep them idempotent.
# Prerequisites (git, python, zsh, brew, paru, scoop) are set up by the
# install scripts and never listed here, so reset can't remove them.

dotfiles:
  links: [shared/bin, windows/bin]

zsh:
  links: [shared/zsh, linux/zsh, macos/zsh]
  macos: [zsh-autosuggestions, zsh-syntax-highlighting, zsh-completions]
  linux: [zsh-autosuggestions, zsh-syntax-highlighting, zsh-completions, pacman-contrib]

powershell:
  links: [windows/powershell]
  windows: [pwsh]
  install:
    windows:
      - 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable PSFzf)) { Install-Module PSFzf -Scope CurrentUser -Force }"'
  check:
    windows: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable PSFzf)) { exit 1 }"'

git:
  links: [shared/git]

delta:
  macos: [git-delta]
  linux: [git-delta]
  windows: [delta]

starship:
  links: [shared/starship]
  macos: [starship]
  linux: [starship]
  windows: [starship]

tmux:
  links: [shared/tmux, linux/tmux, linux/bin/tmux-dev, macos/tmux]
  macos: [tmux]
  linux: [tmux]

ghostty:
  links: [linux/ghostty, macos/ghostty]
  macos: [ghostty]
  linux: [ghostty]

wezterm:
  links: [windows/wezterm]
  windows: [extras/wezterm]

neovim:
  links: [shared/nvim]
  macos: [neovim, tree-sitter-cli]
  linux: [neovim, tree-sitter-cli]
  windows: [neovim, tree-sitter]

vscode:
  links: [shared/vscode]
  macos: [visual-studio-code]
  linux: [visual-studio-code-bin]
  windows: [extras/vscode]

node:
  links: [shared/node]
  macos: [fnm]
  linux: [fnm-bin]
  windows: [fnm]

docker:
  macos: [orbstack]
  linux: [docker, docker-compose, docker-buildx]
  install:
    linux:
      - sudo systemctl enable --now docker.service
      - id -nG "$USER" | grep -qw docker || sudo usermod -aG docker "$USER"
  check:
    linux: >-
      systemctl is-enabled -q docker.service &&
      systemctl is-active -q docker.service &&
      id -nG "$USER" | grep -qw docker
  reset:
    linux: [sudo systemctl disable --now docker.service docker.socket]

dotnet:
  linux: [dotnet-sdk]

fonts:
  macos: [font-jetbrains-mono-nerd-font]
  windows: [nerd-fonts/JetBrainsMono-NF]
  install:
    linux:
      - >-
        [ -d ~/.local/share/fonts/JetBrainsMono ] || {
        mkdir -p ~/.local/share/fonts &&
        curl -fLo /tmp/JetBrainsMono.zip https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip &&
        unzip -o /tmp/JetBrainsMono.zip -d ~/.local/share/fonts/JetBrainsMono &&
        rm /tmp/JetBrainsMono.zip && fc-cache -f; }
  check:
    linux: '[ -d ~/.local/share/fonts/JetBrainsMono ]'
  reset:
    linux: [rm -rf ~/.local/share/fonts/JetBrainsMono && fc-cache -f]

fzf:
  macos: [fzf]
  linux: [fzf]
  windows: [fzf]

zoxide:
  macos: [zoxide]
  linux: [zoxide]
  windows: [zoxide]

atuin:
  macos: [atuin]
  linux: [atuin]

yazi:
  macos: [yazi]
  linux: [yazi]

bat:
  macos: [bat]
  linux: [bat]
  windows: [bat]

ripgrep:
